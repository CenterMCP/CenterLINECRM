version: '3'
tasks:
  build:
    cmds:
      - go build -o build/centerlinecrm ./cmd/server
  test:
    cmds:
      - go test -race ./...
  check:
    cmds:
      - go vet ./...
      - go test -race ./...
  run-dev:
    cmds:
      - go run ./cmd/server
  docker-build:
    cmds:
      - docker build -t centerlinecrm .
